<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrankPass - Standalone Air-Gapped Offline Password Generator</title>
  <meta name="description" content="100% self-contained standalone offline password generator. Zero network calls, zero database, pure mathematics. Works in airplane mode forever.">
  <style>
    /* WCAG 2.1 AA Compliant Dual Theme Variables */
    :root {
      --bg-primary: #0a0d14;
      --bg-secondary: #121824;
      --bg-card: #182234;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --border: rgba(255, 255, 255, 0.12);
      --success: #10b981;
      --radius: 12px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #f1f5f9;
      --text-primary: #0f172a;
      --text-muted: #475569;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.15);
      --border: #cbd5e1;
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent);
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .badge-airgap {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--success);
      color: var(--success);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .form-control {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-with-action {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-action input {
      padding-right: 3rem;
    }

    .btn-inline {
      position: absolute;
      right: 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
    }

    .btn-inline:hover {
      color: var(--text-primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-generate {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-generate:hover {
      background: var(--accent-hover);
    }

    .btn-generate:active {
      transform: scale(0.99);
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }

    .result-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .password-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-all;
      background: var(--bg-secondary);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
      user-select: all;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action {
      flex: 1;
      padding: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn-action:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
        <path d="M16 2 L28 8 L28 16 C28 23 22 28 16 30 C10 28 4 23 4 16 L4 8 Z" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
        <path d="M13 15 L15 17 L19 13" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Frank</span>Pass
    </div>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️ / 🌙</button>
  </div>

  <div class="badge-airgap">
    <span>🛡️</span> 100% Offline Air-Gapped · Zero Storage
  </div>

  <form id="gen-form" onsubmit="handleGenerate(event)">
    <div class="form-group">
      <label class="form-label" for="plat-input">
        <span>Platform / Website Domain</span>
        <span class="hint" id="plat-hint">e.g. google.com, github.com</span>
      </label>
      <input type="text" id="plat-input" class="form-control" placeholder="e.g. google.com, sbi, aws" required autofocus autocomplete="off" oninput="updateHint()">
    </div>

    <div class="form-group">
      <label class="form-label" for="user-input">
        <span>Username / Account ID (Optional)</span>
        <span class="hint">Keep blank for single account</span>
      </label>
      <input type="text" id="user-input" class="form-control" placeholder="e.g. user@gmail.com (optional)" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label" for="key-input">
        <span>Personal Secret Key (Master Memory Phrase)</span>
        <span class="hint">Never leaves this tab</span>
      </label>
      <div class="input-with-action">
        <input type="password" id="key-input" class="form-control" placeholder="Enter your personal memorable key" required autocomplete="off">
        <button type="button" class="btn-inline" onclick="toggleKeyVisibility()" title="Toggle visibility">👁️</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label" for="variant-select">
          <span>Password Variant</span>
        </label>
        <select id="variant-select" class="form-control">
          <option value="1">v1 (Default)</option>
          <option value="2">v2 (Rotated 1)</option>
          <option value="3">v3 (Rotated 2)</option>
          <option value="4">v4 (Rotated 3)</option>
          <option value="5">v5 (Rotated 4)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="profile-select">
          <span>Character Profile</span>
        </label>
        <select id="profile-select" class="form-control">
          <option value="standard" selected>Standard (Symbols + Numbers)</option>
          <option value="alphanumeric">Alphanumeric (Letters + Numbers)</option>
          <option value="letters">Letters Only (A-Z, a-z)</option>
          <option value="numeric">PIN / Numbers Only (0-9)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="len-input">
        <span>Password Length: <b id="len-val" style="color:var(--accent)">16</b> chars</span>
      </label>
      <input type="range" id="len-input" min="8" max="64" value="16" style="width:100%;accent-color:var(--accent)" oninput="document.getElementById('len-val').textContent = this.value">
    </div>

    <button type="submit" class="btn-generate" id="gen-btn">
      <span>⚡</span> Generate Cryptographic Password
    </button>
  </form>

  <div class="result-box" id="result-box">
    <div class="result-label">Deterministic Output Password</div>
    <div class="password-display" id="pass-output">••••••••••••••••</div>
    <div class="action-row">
      <button class="btn-action" onclick="copyPassword()">
        <span>📋</span> Copy
      </button>
      <button class="btn-action" onclick="togglePasswordVisibility()">
        <span id="vis-icon">👁️</span> <span id="vis-text">Show</span>
      </button>
      <button class="btn-action" onclick="clearSecretKey()" style="color:#ef4444">
        <span>🗑️</span> Purge RAM
      </button>
    </div>
  </div>

  <div class="footer">
    <p>FrankPass Standalone Offline Engine &middot; Pure WebCrypto PBKDF2 SHA-512</p>
    <p style="margin-top:0.25rem">Crafted with 100% Zero-Trust Privacy by <strong>Master Manikant Yadav</strong></p>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
/* ─── 1. Embedded FrankPass Cryptographic Engine ─── */
const FRANKPASS_CORE = (function () {
    const APP_ID = "MasterManikant_PassGen";
    const VERSION = "v1";
    const UPPERCASE = "ADEFHLMNRT";
    const LOWERCASE = "defhmt";
    const NUMBERS = "2346789";
    const SYMBOLS = "@#$%&*+=?";
    const DEFAULT_PEPPER = "FrankbaseSuperSecretMango2026!";

    async function getLocalPepper(platform, username, secretKey) {
        const encoder = new TextEncoder();
        const normalizedSecret = secretKey.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
        const dataStr = `Version=${VERSION}|User=${username.toLowerCase()}|Plat=${platform.toLowerCase()}|Key=${normalizedSecret}`;

        const keyMaterial = await crypto.subtle.importKey(
            'raw',
            encoder.encode(DEFAULT_PEPPER),
            { name: 'HMAC', hash: 'SHA-512' },
            false,
            ['sign']
        );
        const hmacBuffer = await crypto.subtle.sign('HMAC', keyMaterial, encoder.encode(dataStr));
        let preKey = Array.from(new Uint8Array(hmacBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

        for (let i = 0; i < 1000; i++) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(preKey + DEFAULT_PEPPER));
            preKey = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        return preKey;
    }

    function bytesToCharacters(byteStream, profile, targetLength) {
        let charset = "";
        let requireUpper = false, requireLower = false, requireNum = false, requireSym = false;

        if (profile === 'standard') {
            charset = UPPERCASE + LOWERCASE + NUMBERS + SYMBOLS;
            requireUpper = requireLower = requireNum = requireSym = true;
        } else if (profile === 'alphanumeric') {
            charset = UPPERCASE + LOWERCASE + NUMBERS;
            requireUpper = requireLower = requireNum = true;
        } else if (profile === 'letters') {
            charset = UPPERCASE + LOWERCASE;
            requireUpper = requireLower = true;
        } else if (profile === 'numeric') {
            charset = "0123456789";
            requireNum = false;
        }

        const charsetLen = charset.length;
        const validMax = 256 - (256 % charsetLen);
        let passwordChars = [];
        let byteIdx = 0;

        while (passwordChars.length < targetLength && byteIdx < byteStream.length) {
            const b = byteStream[byteIdx++];
            if (b < validMax) passwordChars.push(charset[b % charsetLen]);
        }

        while (passwordChars.length < targetLength) passwordChars.push(charset[0]);

        const requiredSets = [];
        if (requireUpper) requiredSets.push(UPPERCASE);
        if (requireLower) requiredSets.push(LOWERCASE);
        if (requireNum) requiredSets.push(NUMBERS);
        if (requireSym) requiredSets.push(SYMBOLS);

        let revIdx = byteStream.length - 1;
        let currentStr = passwordChars.join('');
        const usedPositions = new Set();

        requiredSets.forEach(set => {
            if (!currentStr.split('').some(c => set.includes(c))) {
                let pos = byteStream[revIdx--] % targetLength;
                while (usedPositions.has(pos) && usedPositions.size < targetLength) {
                    pos = (pos + 1) % targetLength;
                }
                usedPositions.add(pos);
                const char = set[byteStream[revIdx--] % set.length];
                passwordChars[pos] = char;
                currentStr = passwordChars.join('');
            }
        });

        return passwordChars.join('');
    }

    return {
        generate: async function (platform, username, secretKey, variant, profile, length) {
            if (typeof crypto === 'undefined' || !crypto.subtle) {
                throw new Error('WebCrypto API is not supported in this browser.');
            }

            const encoder = new TextEncoder();
            const pepper = await getLocalPepper(platform, username, secretKey);
            const ctxString = `${APP_ID.length}:${APP_ID}|${VERSION.length}:${VERSION}|${platform.length}:${platform}|${username.length}:${username}|${pepper.length}:${pepper}|${variant.toString().length}:${variant}|${profile.length}:${profile}|${length.toString().length}:${length}`;
            const seedData = encoder.encode(ctxString.normalize('NFC'));

            const baseKey = await crypto.subtle.importKey(
                'raw', encoder.encode(pepper.normalize('NFC')), 'PBKDF2', false, ['deriveBits']
            );
            const pbkdf2Bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt: seedData, iterations: 1000000, hash: 'SHA-512' }, baseKey, 512
            );

            const prkKey = await crypto.subtle.importKey(
                'raw', pbkdf2Bits, { name: 'HMAC', hash: 'SHA-512' }, false, ['sign']
            );

            let outputBytes = new Uint8Array(0);
            let sig1 = await crypto.subtle.sign('HMAC', prkKey, new Uint8Array([1]));
            outputBytes = new Uint8Array([...outputBytes, ...new Uint8Array(sig1)]);
            let sig2 = await crypto.subtle.sign('HMAC', prkKey, new Uint8Array([...new Uint8Array(sig1), 2]));
            outputBytes = new Uint8Array([...outputBytes, ...new Uint8Array(sig2)]);

            return bytesToCharacters(outputBytes, profile, parseInt(length, 10));
        }
    };
})();

/* ─── 2. Embedded Normalization & Aliases ─── */
const GLOBAL_ALIASES = {
    'gmail': 'google', 'gdrive': 'google', 'goog': 'google',
    'outlook': 'microsoft', 'hotmail': 'microsoft', 'live': 'microsoft', 'office': 'microsoft',
    'appleid': 'apple', 'icloud': 'apple',
    'fb': 'facebook', 'meta': 'facebook', 'tw': 'twitter', 'ig': 'instagram', 'yt': 'youtube', 'wa': 'whatsapp',
    'aws': 'aws', 'azure': 'azure', 'gcp': 'googlecloud', 'sbi': 'statebankofindia', 'hdfc': 'hdfcbank', 'icici': 'icicibank'
};

const VISUAL_ALIASES = {
    'aws.amazon.com': 'aws', 'portal.azure.com': 'azure', 'cloud.google.com': 'googlecloud',
    'github.com': 'github', 'gitlab.com': 'gitlab', 'chatgpt.com': 'chatgpt', 'claude.ai': 'anthropic',
    'onlinesbi.sbi': 'statebankofindia', 'netbanking.hdfcbank.com': 'hdfcbank'
};

function normalizePlatform(raw) {
    if (!raw) return '';
    let p = raw.toLowerCase().trim().replace(/^(https?:\/\/)?/, '').split('?')[0].split('#')[0];
    if (p.includes('/')) p = p.split('/')[0];
    if (p.includes('@')) p = p.split('@')[1];
    if (VISUAL_ALIASES[p]) return VISUAL_ALIASES[p];
    p = p.replace(/^(www\.|m\.|app\.|login\.)/, '');
    if (VISUAL_ALIASES[p]) return VISUAL_ALIASES[p];
    let parts = p.split('.');
    if (parts.length > 2 && parts[parts.length - 2].length <= 3) {
        p = parts[parts.length - 3];
    } else if (parts.length >= 2) {
        p = parts[parts.length - 2];
    } else {
        p = parts[0];
    }
    p = p.replace(/[^a-z0-9]/g, '');
    return GLOBAL_ALIASES[p] || p;
}

/* ─── 3. UI State Management ─── */
let currentGeneratedPassword = '';
let isPasswordVisible = false;

function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
}

function updateHint() {
    const raw = document.getElementById('plat-input').value;
    const norm = normalizePlatform(raw);
    const hintEl = document.getElementById('plat-hint');
    if (norm) {
        hintEl.textContent = `Canonical Seed: "${norm}"`;
        hintEl.style.color = 'var(--accent)';
    } else {
        hintEl.textContent = 'e.g. google.com, github.com';
        hintEl.style.color = 'var(--text-muted)';
    }
}

function toggleKeyVisibility() {
    const inp = document.getElementById('key-input');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function handleGenerate(e) {
    e.preventDefault();
    const platRaw = document.getElementById('plat-input').value;
    const user = document.getElementById('user-input').value.trim();
    const key = document.getElementById('key-input').value;
    const variant = document.getElementById('variant-select').value;
    const profile = document.getElementById('profile-select').value;
    const length = document.getElementById('len-input').value;

    const plat = normalizePlatform(platRaw);
    if (!plat || !key) return;

    const btn = document.getElementById('gen-btn');
    btn.innerHTML = '<span>⏳</span> Deriving Key...';
    btn.disabled = true;

    try {
        const password = await FRANKPASS_CORE.generate(plat, user, key, variant, profile, length);
        currentGeneratedPassword = password;
        
        const box = document.getElementById('result-box');
        box.style.display = 'block';
        
        renderPassword();
        showToast('Password derived in device RAM!');
    } catch (err) {
        alert('Generation failed: ' + err.message);
    } finally {
        btn.innerHTML = '<span>⚡</span> Generate Cryptographic Password';
        btn.disabled = false;
    }
}

function renderPassword() {
    const out = document.getElementById('pass-output');
    if (isPasswordVisible) {
        out.textContent = currentGeneratedPassword;
    } else {
        out.textContent = '•'.repeat(currentGeneratedPassword.length);
    }
}

function togglePasswordVisibility() {
    isPasswordVisible = !isPasswordVisible;
    document.getElementById('vis-text').textContent = isPasswordVisible ? 'Hide' : 'Show';
    renderPassword();
}

function copyPassword() {
    if (!currentGeneratedPassword) return;
    navigator.clipboard.writeText(currentGeneratedPassword).then(() => {
        showToast('Copied to clipboard!');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = currentGeneratedPassword;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied to clipboard!');
    });
}

function clearSecretKey() {
    document.getElementById('key-input').value = '';
    currentGeneratedPassword = '';
    document.getElementById('result-box').style.display = 'none';
    showToast('RAM purged: Secret Key cleared.');
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>

</body>
</html>
